name: bullky

include:
  - ./services/redis-cache/compose.yml
  - ./services/redis-queue/compose.yml

volumes:
  bullky-cache-data:
    driver: local
    name: bullky-cache-data
  bullky-queue-data:
    driver: local
    name: bullky-queue-data

networks:
  bullky-network:
    driver: bridge
    name: bullky-network
